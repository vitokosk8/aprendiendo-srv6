frr version 10.2.1
frr defaults traditional
hostname r1
!
interface eth1
 description hacia h1
 ipv6 address 3fff:0:1::1/64
exit
interface eth2
 description hacia r2
 ipv6 address 3fff:0:12::1/64
exit
interface eth3
 description hacia r3
 ipv6 address 3fff:0:13::1/64
exit
!
! Rutas estáticas hacia las redes que no están directamente conectadas
ipv6 route 3fff:0:2::/64 3fff:0:12::2
ipv6 route 3fff:0:3::/64 3fff:0:13::3
ipv6 route 3fff:0:23::/64 3fff:0:12::2
!
