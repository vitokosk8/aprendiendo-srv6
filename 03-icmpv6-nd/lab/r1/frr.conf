frr version 10.7.1
frr defaults traditional
hostname r1
!
! LAN compartida: r1 es el router por defecto y lo anuncia con RA
interface eth1
 description LAN 3fff:0:10::/64 (sw1)
 ipv6 address 3fff:0:10::1/64
 ipv6 nd prefix 3fff:0:10::/64
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
! Red de h4: dirección fija, sin RA
interface eth2
 description red de h4
 ipv6 address 3fff:0:40::1/64
exit
!
