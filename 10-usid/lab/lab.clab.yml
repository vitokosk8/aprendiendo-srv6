# Módulo 10 · uSID: SIDs comprimidos (NEXT-C-SID)
#
#   h1 ── r1 ══════ r2 ══════ r3 ── h2
#   dual-stack   (núcleo solo IPv6, SRv6 uSID)   dual-stack
#
# Misma topología que los módulos 08/09, pero el núcleo usa uSID (NEXT-C-SID):
# varios saltos caben en UNA sola dirección IPv6 (el "contenedor"), sin SRH para
# el tránsito. Cada router instala UNA ruta /48 con el behavior uN (End con el
# flavor next-csid), que sirve para CUALQUIER contenedor que pase por él.
#
# Formato F3216: bloque de 32 bits (lblen 32) + C-SID de 16 bits (nflen 16).
#   bloque común:  5f00:0000::/32
#   uN de r1:      5f00:0:1::/48   (C-SID 0001)
#   uN de r2:      5f00:0:2::/48   (C-SID 0002)
#   uN de r3:      5f00:0:3::/48   (C-SID 0003)
# Service SIDs clásicos (/128, más específicos) para la entrega final:
#   r1: 5f00:0:1:dc04:: [End.DX4]   5f00:0:1:d600:: [End.DT6]
#   r3: 5f00:0:3:dc04:: [End.DX4]   5f00:0:3:d600:: [End.DT6]
#
# Contenedor de ida (IPv4 h1->h2):  5f00:0:2:3::  (pasa por r2, luego r3)
#   + service SID 5f00:0:3:dc04::   (r3 desencapsula y entrega el IPv4)
#
#   python3 herramientas/topologia.py 10-usid/lab/lab.clab.yml
#
# Requiere kernel >= 6.6 e iproute2 con soporte de 'flavors next-csid'.
# Probado con containerlab 0.74.3, FRR 10.2.1, netshoot v0.13, kernel 7.2 (OrbStack).

name: m10

topology:
  defaults:
    kind: linux
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.seg6_enabled: 1
      net.ipv6.conf.default.seg6_enabled: 1

  nodes:
    h1:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 1, graph-icon: host, ip.eth1: "3fff:0:1::10/64, 10.0.1.10/24"}
      exec:
        - "ip -6 route del default dev eth0"
        - "ip -6 addr add 3fff:0:1::10/64 dev eth1"
        - "ip addr add 10.0.1.10/24 dev eth1"
        - "ip -6 route add default via 3fff:0:1::1 dev eth1"
        - "ip route flush default"
        - "ip route add default via 10.0.1.1 dev eth1"

    r1:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 2, graph-icon: router, ip.lo: "3fff:0:ff::1/128", ip.eth1: "3fff:0:1::1/64, 10.0.1.1/24", ip.eth2: "3fff:0:12::1/64", srv6.locator: "5f00:0:1::/48 (uN)", srv6.sids: "5f00:0:1:dc04:: End.DX4; 5f00:0:1:d600:: End.DT6"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf, r1/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "ip addr add 10.0.1.1/24 dev eth1"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip sr tunsrc set 3fff:0:ff::1"
        # uN de r1 (End con next-csid) en su /48. 'replace' por el prefijo conectado del locator.
        - "ip -6 route replace 5f00:0:1::/48 encap seg6local action End flavors next-csid lblen 32 nflen 16 metric 100 dev eth1"
        # El kernel crea la anycast de subred 5f00:0:1:: en la tabla local; la quitamos
        # para que el aterrizaje del contenedor lo procese el uN y no se entregue localmente.
        - "bash -c 'for i in $(seq 1 15); do ip -6 route del anycast 5f00:0:1:: dev lo table local 2>/dev/null && break; sleep 1; done'"
        # Service SIDs clásicos de r1 (para el tráfico de vuelta de h2 hacia h1)
        - "ip -6 route add 5f00:0:1:dc04::/128 encap seg6local action End.DX4 nh4 10.0.1.10 dev eth1"
        - "ip -6 route add 5f00:0:1:d600::/128 encap seg6local action End.DT6 table 254 dev eth1"
        # Encap con uSID: el IPv4 de h1 hacia la red de h2 entra en un contenedor [r2,r3] + service
        - "ip route add 10.0.2.0/24 encap seg6 mode encap.red segs 5f00:0:2:3::,5f00:0:3:dc04:: dev eth2"

    r2:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 3, graph-icon: router, ip.lo: "3fff:0:ff::2/128", ip.eth1: "3fff:0:12::2/64", ip.eth2: "3fff:0:23::2/64", srv6.locator: "5f00:0:2::/48 (uN)", srv6.sids: "5f00:0:2::/48 uN (End+next-csid)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf, r2/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        # uN de r2: UNA sola ruta /48 que procesa cualquier contenedor con 0002 activo
        - "ip -6 route replace 5f00:0:2::/48 encap seg6local action End flavors next-csid lblen 32 nflen 16 metric 100 dev eth1"
        # El kernel crea la anycast de subred 5f00:0:2:: en la tabla local; la quitamos
        # para que el aterrizaje del contenedor lo procese el uN y no se entregue localmente.
        - "bash -c 'for i in $(seq 1 15); do ip -6 route del anycast 5f00:0:2:: dev lo table local 2>/dev/null && break; sleep 1; done'"

    r3:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 4, graph-icon: router, ip.lo: "3fff:0:ff::3/128", ip.eth1: "3fff:0:23::3/64", ip.eth2: "3fff:0:2::1/64, 10.0.2.1/24", srv6.locator: "5f00:0:3::/48 (uN)", srv6.sids: "5f00:0:3:dc04:: End.DX4; 5f00:0:3:d600:: End.DT6"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf, r3/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "ip addr add 10.0.2.1/24 dev eth2"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip sr tunsrc set 3fff:0:ff::3"
        # uN de r3 en su /48 (procesa el 0003 del contenedor y, al agotarse, salta al service SID)
        - "ip -6 route replace 5f00:0:3::/48 encap seg6local action End flavors next-csid lblen 32 nflen 16 metric 100 dev eth1"
        # El kernel crea la anycast de subred 5f00:0:3:: en la tabla local; la quitamos
        # para que el aterrizaje del contenedor lo procese el uN y no se entregue localmente.
        - "bash -c 'for i in $(seq 1 15); do ip -6 route del anycast 5f00:0:3:: dev lo table local 2>/dev/null && break; sleep 1; done'"
        # Service SIDs clásicos de r3 (/128, ganan por longest-prefix a la ruta uN /48)
        - "ip -6 route add 5f00:0:3:dc04::/128 encap seg6local action End.DX4 nh4 10.0.2.20 dev eth2"
        - "ip -6 route add 5f00:0:3:d600::/128 encap seg6local action End.DT6 table 254 dev eth1"
        # Encap de vuelta: contenedor [r2,r1] + service SID de r1
        - "ip route add 10.0.1.0/24 encap seg6 mode encap.red segs 5f00:0:2:1::,5f00:0:1:dc04:: dev eth1"

    h2:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 5, graph-icon: host, ip.eth1: "3fff:0:2::20/64, 10.0.2.20/24"}
      exec:
        - "ip -6 route del default dev eth0"
        - "ip -6 addr add 3fff:0:2::20/64 dev eth1"
        - "ip addr add 10.0.2.20/24 dev eth1"
        - "ip -6 route add default via 3fff:0:2::1 dev eth1"
        - "ip route flush default"
        - "ip route add default via 10.0.2.1 dev eth1"

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "h2:eth1"]
