frr version 10.7.1
frr defaults traditional
hostname r1
!
interface lo
 ipv6 address 3fff:0:ff::1/128
 ipv6 address 5f00:0:1::1/48
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:1::1/64
 ipv6 router isis CORE
 isis passive
exit
interface eth2
 ipv6 address 3fff:0:12::1/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
exit
!
