frr version 10.2.1
frr defaults traditional
hostname r1
!
interface eth1
 description hacia h1
 ipv6 address 3fff:0:1::1/64
exit
!
interface eth2
 description hacia r2 (MTU 1400)
 ipv6 address 3fff:0:12::1/64
exit
!
! Ruta estática hacia la red de h2 (el enrutamiento se estudia en el módulo 04)
ipv6 route 3fff:0:2::/64 3fff:0:12::2
!
