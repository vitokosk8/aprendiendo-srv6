frr version 10.7.1
frr defaults traditional
hostname r2
!
interface eth1
 description hacia r1 (MTU 1400)
 ipv6 address 3fff:0:12::2/64
exit
!
interface eth2
 description hacia h2
 ipv6 address 3fff:0:2::1/64
exit
!
