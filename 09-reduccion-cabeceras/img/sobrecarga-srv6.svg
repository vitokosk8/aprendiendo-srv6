<text x='201.0' y='147' font-size='12' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' fill='#59636e' text-anchor='middle' dominant-baseline='middle'>con H.Encaps.Red y un solo SID: 40 bytes, sin SRH</text>

