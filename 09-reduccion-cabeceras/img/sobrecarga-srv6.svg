<rect x='198' y='6' width='180' height='84' rx='6' fill='#fff1e5' stroke='#bc4c00' stroke-width='1.6'/>
<text x='288.0' y='30.0' font-size='14' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-weight='600' fill='#1f2328' text-anchor='middle' dominant-baseline='middle'>SRH</text>
