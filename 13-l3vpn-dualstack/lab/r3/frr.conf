frr version 10.2.1
frr defaults traditional
hostname r3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:3::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::3/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:23::3/64
 ipv6 router isis CORE
 isis network point-to-point
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 65000
 bgp router-id 10.0.0.3
 no bgp default ipv4-unicast
 neighbor 3fff:0:ff::1 remote-as 65000
 neighbor 3fff:0:ff::1 update-source lo
 neighbor 3fff:0:ff::1 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::1 activate
 exit-address-family
 address-family ipv6 vpn
  neighbor 3fff:0:ff::1 activate
 exit-address-family
exit
!
router bgp 65000 vrf CUST
 bgp router-id 10.0.2.1
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 10.0.0.3:101
  rt vpn both 65000:101
  export vpn
  import vpn
 exit-address-family
 address-family ipv6 unicast
  redistribute connected
  rd vpn export 10.0.0.3:101
  rt vpn both 65000:101
  export vpn
  import vpn
 exit-address-family
exit
!
