frr version 10.2.1
frr defaults traditional
hostname r3
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:3::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::3/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:13::3/64
 ipv6 router isis CORE
 isis network point-to-point
 isis fast-reroute lfa level-2
 isis metric 20
exit
interface eth2
 ipv6 address 3fff:0:34::3/64
 ipv6 router isis CORE
 isis network point-to-point
 isis fast-reroute lfa level-2
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
