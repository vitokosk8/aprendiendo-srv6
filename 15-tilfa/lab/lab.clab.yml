# Módulo 15 · Resiliencia: TI-LFA
#
#            ┌──── r2 ────┐            (camino PRIMARIO: coste 20)
#        r1  │            │  r4
#            └──── r3 ────┘            (camino de RESPALDO: coste 30, enlace r1-r3 métrica 20)
#
# Topología en diamante: dos caminos de r1 a r4. El IGP usa el primario (por r2).
# Con fast-reroute (TI-LFA) activado, cada router PRECALCULA un respaldo; si cae el
# enlace primario, conmuta al alternativo (por r3) sin esperar a que reconverja el IGP.
#
# Plano de control (FRR): IS-IS+SRv6 (locators, End/End.X) + 'isis fast-reroute lfa'
# en las interfaces de núcleo. Se demuestra la conmutación rompiendo el enlace r1-r2 y
# viendo que r1 sigue alcanzando a r4 (por r3).
#
# ALCANCE FRR (honesto, comprobado): con LFA clásico FRR protege el transporte IPv6/SRv6
# al 100% en este diamante (hay alternativo sin bucle). Con 'ti-lfa' la cobertura SRv6
# sale 0%: el TI-LFA de FRR programa el plano SR-MPLS (RFC 8667, experimental); la
# TI-LFA SRv6 completa (repair list de SIDs) es función de plataforma (IOS-XR, etc.).
#
#   python3 herramientas/topologia.py 15-tilfa/lab/lab.clab.yml
#
# Probado con containerlab 0.82.0, FRR 10.7.1, netshoot v0.13, kernel 7.2 (OrbStack).

name: m15

topology:
  defaults:
    kind: linux
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.seg6_enabled: 1
      net.ipv6.conf.default.seg6_enabled: 1

  nodes:
    r1:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 1, graph-icon: router, graph-desc: "PLR · FRR", ip.lo: "3fff:0:ff::1/128", ip.eth2: "3fff:0:12::1/64", ip.eth3: "3fff:0:13::1/64 (m=20)", srv6.locator: "5f00:0:1::/48", srv6.sids: "End/End.X automáticos + fast-reroute"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf, r1/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r2:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 2, graph-row: 1, graph-icon: router, graph-desc: "núcleo (primario)", ip.lo: "3fff:0:ff::2/128", ip.eth1: "3fff:0:12::2/64", ip.eth2: "3fff:0:24::2/64", srv6.locator: "5f00:0:2::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf, r2/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r3:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 2, graph-row: 2, graph-icon: router, graph-desc: "núcleo (respaldo)", ip.lo: "3fff:0:ff::3/128", ip.eth1: "3fff:0:13::3/64 (m=20)", ip.eth2: "3fff:0:34::3/64", srv6.locator: "5f00:0:3::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf, r3/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r4:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 3, graph-icon: router, graph-desc: "destino · FRR", ip.lo: "3fff:0:ff::4/128", ip.eth1: "3fff:0:24::4/64", ip.eth2: "3fff:0:34::4/64", srv6.locator: "5f00:0:4::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r4/daemons:/etc/frr/daemons, r4/frr.conf:/etc/frr/frr.conf, r4/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

  links:
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r1:eth3", "r3:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r3:eth2", "r4:eth2"]
