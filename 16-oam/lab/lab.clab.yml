# Módulo 16 · OAM y troubleshooting
#
#   h1 ── r1 ══════ r2 ══════ r3 ── h2
#   dual-stack   (núcleo IPv6, IS-IS + SRv6)   dual-stack
#
# Red SRv6 que funciona (misma base que el módulo 11: IS-IS+SRv6 con locators y SIDs
# automáticos sobre sr0), MÁS un servicio manual End.DX4 para tener tráfico IPv4 de
# cliente de h1 a h2 sobre SRv6 que poder trazar y capturar.
#
# El módulo es de CONSOLIDACIÓN: aquí se usan las herramientas de OAM y diagnóstico
# (ping, traceroute, captura y decodificación de la SRH, comandos show) sobre esta red,
# y se recorre un catálogo de fallos típicos de SRv6 (los que fuimos encontrando en el
# curso: seg6_enabled, locator no anunciado, strict_mode, dev en el encap, etc.).
#
# SIDs: FRR instala End/End.X automáticos; el servicio es manual:
#   r1: 5f00:0:1:dc04:: [End.DX4]   r3: 5f00:0:3:dc04:: [End.DX4]
#
#   python3 herramientas/topologia.py 16-oam/lab/lab.clab.yml
#
# Probado con containerlab 0.74.3, FRR 10.2.1, netshoot v0.13, kernel 7.2 (OrbStack).

name: m16

topology:
  defaults:
    kind: linux
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.seg6_enabled: 1
      net.ipv6.conf.default.seg6_enabled: 1

  nodes:
    h1:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 1, graph-icon: host, ip.eth1: "3fff:0:1::10/64, 10.0.1.10/24"}
      exec:
        - "ip -6 route del default dev eth0"
        - "ip -6 addr add 3fff:0:1::10/64 dev eth1"
        - "ip addr add 10.0.1.10/24 dev eth1"
        - "ip -6 route add default via 3fff:0:1::1 dev eth1"
        - "ip route flush default"
        - "ip route add default via 10.0.1.1 dev eth1"

    r1:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 2, graph-icon: router, ip.lo: "3fff:0:ff::1/128", ip.eth1: "3fff:0:1::1/64, 10.0.1.1/24", ip.eth2: "3fff:0:12::1/64", srv6.locator: "5f00:0:1::/48 (FRR→sr0)", srv6.sids: "End/End.X automáticos (IS-IS)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf, r1/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "ip addr add 10.0.1.1/24 dev eth1"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        # Interfaz dummy donde FRR instala los SIDs SRv6. Al aparecer sr0, zebra los coloca
        # automáticamente (no hay que reiniciar FRR; reiniciarlo rompería las adyacencias IS-IS).
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"
        # Servicio manual (como en el módulo 11): tráfico IPv4 de cliente sobre SRv6, para poder trazarlo
        - "ip sr tunsrc set 3fff:0:ff::1"
        - "ip -6 route add 5f00:0:1:dc04::/128 encap seg6local action End.DX4 nh4 10.0.1.10 dev eth1"
        - "ip route add 10.0.2.0/24 encap seg6 mode encap.red segs 5f00:0:3:dc04:: dev eth2"

    r2:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 3, graph-icon: router, ip.lo: "3fff:0:ff::2/128", ip.eth1: "3fff:0:12::2/64", ip.eth2: "3fff:0:23::2/64", srv6.locator: "5f00:0:2::/48 (FRR→sr0)", srv6.sids: "End/End.X automáticos (IS-IS)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf, r2/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        # Interfaz dummy donde FRR instala los SIDs SRv6. Al aparecer sr0, zebra los coloca
        # automáticamente (no hay que reiniciar FRR; reiniciarlo rompería las adyacencias IS-IS).
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r3:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 4, graph-icon: router, ip.lo: "3fff:0:ff::3/128", ip.eth1: "3fff:0:23::3/64", ip.eth2: "3fff:0:2::1/64, 10.0.2.1/24", srv6.locator: "5f00:0:3::/48 (FRR→sr0)", srv6.sids: "End/End.X automáticos (IS-IS)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf, r3/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "ip addr add 10.0.2.1/24 dev eth2"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        # Interfaz dummy donde FRR instala los SIDs SRv6. Al aparecer sr0, zebra los coloca
        # automáticamente (no hay que reiniciar FRR; reiniciarlo rompería las adyacencias IS-IS).
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"
        # Servicio manual (vuelta): entrega el IPv4 a h1
        - "ip sr tunsrc set 3fff:0:ff::3"
        - "ip -6 route add 5f00:0:3:dc04::/128 encap seg6local action End.DX4 nh4 10.0.2.20 dev eth2"
        - "ip route add 10.0.1.0/24 encap seg6 mode encap.red segs 5f00:0:1:dc04:: dev eth1"

    h2:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 5, graph-icon: host, ip.eth1: "3fff:0:2::20/64, 10.0.2.20/24"}
      exec:
        - "ip -6 route del default dev eth0"
        - "ip -6 addr add 3fff:0:2::20/64 dev eth1"
        - "ip addr add 10.0.2.20/24 dev eth1"
        - "ip -6 route add default via 3fff:0:2::1 dev eth1"
        - "ip route flush default"
        - "ip route add default via 10.0.2.1 dev eth1"

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "h2:eth1"]
