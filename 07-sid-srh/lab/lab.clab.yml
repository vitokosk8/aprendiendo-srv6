# Módulo 07 · El SID y la Segment Routing Header
#
#   h1 ── r1 ── r2 ── r3 ── h2
#              (End) (End.DT6)
#
# Cadena lineal. r1, r2 y r3 usan IS-IS para alcanzarse. r2 y r3 anuncian además
# un "bloque de SID" / localizador (5f00:0:N::/48) en su loopback. Sobre ese bloque se instalan
# a mano, con iproute2, dos SID:
#   r2: 5f00:0:2:e000::  -> End      (avanza al siguiente segmento)
#   r3: 5f00:0:3:e000::  -> End.DT6  (desencapsula y entrega al destino interior)
#
# En h1 está scripts/srh.py (Scapy) para fabricar y diseccionar una SRH.
# El objetivo del módulo es LEER la cabecera; los behaviors se estudian en el 08.
#
# Esquema de conexionado:
#   python3 herramientas/topologia.py 07-sid-srh/lab/lab.clab.yml
#
# Probado con containerlab 0.74.3, FRR 10.2.1, netshoot v0.13, kernel 7.2 (OrbStack).

name: m07

topology:
  defaults:
    kind: linux
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.seg6_enabled: 1
      net.ipv6.conf.default.seg6_enabled: 1

  nodes:
    h1:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 1, graph-icon: host, ip.eth1: "3fff:0:1::10/64"}
      binds: [scripts:/lab:ro]
      exec:
        - ip -6 route del default dev eth0
        - ip -6 addr add 3fff:0:1::10/64 dev eth1
        - ip -6 route add default via 3fff:0:1::1 dev eth1

    r1:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 2, graph-icon: router, ip.lo: "3fff:0:ff::1/128", ip.eth1: "3fff:0:1::1/64", ip.eth2: "3fff:0:12::1/64"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf, r1/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - ip -6 route del default dev eth0
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1

    r2:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 3, graph-icon: router, ip.lo: "3fff:0:ff::2/128", ip.eth1: "3fff:0:12::2/64", ip.eth2: "3fff:0:23::2/64", srv6.locator: "5f00:0:2::/48", srv6.sids: "5f00:0:2:e000:: End"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf, r2/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - ip -6 route del default dev eth0
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1
        - ip -6 route add 5f00:0:2:e000::/128 encap seg6local action End dev eth1

    r3:
      image: quay.io/frrouting/frr:10.2.1
      labels: {graph-level: 4, graph-icon: router, ip.lo: "3fff:0:ff::3/128", ip.eth1: "3fff:0:23::3/64", ip.eth2: "3fff:0:2::1/64", srv6.locator: "5f00:0:3::/48", srv6.sids: "5f00:0:3:e000:: End.DT6"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf, r3/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - ip -6 route del default dev eth0
        - sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1
        - ip -6 route add 5f00:0:3:e000::/128 encap seg6local action End.DT6 table 254 dev eth1

    h2:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 5, graph-icon: host, ip.eth1: "3fff:0:2::20/64"}
      exec:
        - ip -6 route del default dev eth0
        - ip -6 addr add 3fff:0:2::20/64 dev eth1
        - ip -6 route add default via 3fff:0:2::1 dev eth1

  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "h2:eth1"]
