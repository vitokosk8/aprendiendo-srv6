frr version 10.2.1
frr defaults traditional
hostname r3
!
interface lo
 ipv6 address 3fff:0:ff::3/128
 ipv6 address 5f00:0:3::/48
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:23::3/64
 ipv6 router isis CORE
 isis network point-to-point
exit
interface eth2
 ipv6 address 3fff:0:2::1/64
 ipv6 router isis CORE
 isis passive
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
exit
!
