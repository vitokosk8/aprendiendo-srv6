frr version 10.7.1
frr defaults traditional
hostname r3
!
interface lo
 ipv6 address 3fff:0:ff::3/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 description hacia r1
 ipv6 address 3fff:0:13::3/64
 ipv6 router isis CORE
 isis network point-to-point
exit
interface eth2
 description hacia r2
 ipv6 address 3fff:0:23::3/64
 ipv6 router isis CORE
 isis network point-to-point
exit
interface eth3
 description hacia h3 (LAN anunciada)
 ipv6 address 3fff:0:3::1/64
 ipv6 router isis CORE
 isis passive
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0003.00
exit
!
