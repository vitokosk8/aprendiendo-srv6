frr version 10.2.1
frr defaults traditional
hostname r2
!
interface lo
 ipv6 address 3fff:0:ff::2/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 description hacia r1
 ipv6 address 3fff:0:12::2/64
 ipv6 router isis CORE
 isis network point-to-point
exit
interface eth2
 description hacia r3
 ipv6 address 3fff:0:23::2/64
 ipv6 router isis CORE
 isis network point-to-point
exit
interface eth3
 description hacia h2 (LAN anunciada)
 ipv6 address 3fff:0:2::1/64
 ipv6 router isis CORE
 isis passive
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
exit
!
