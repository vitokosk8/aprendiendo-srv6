frr version 10.7.1
frr defaults traditional
hostname r6
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:6::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::6/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:46::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
 ! retardo del enlace, en microsegundos: IS-IS lo anuncia y BGP-LS lo lleva al controlador
 link-params
  delay 2000
 exit-link-params
exit
interface eth2
 ipv6 address 3fff:0:56::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
 ! retardo del enlace, en microsegundos: IS-IS lo anuncia y BGP-LS lo lleva al controlador
 link-params
  delay 2000
 exit-link-params
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0006.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.6
 no bgp default ipv4-unicast
 neighbor 3fff:0:ff::1 remote-as 64500
 neighbor 3fff:0:ff::1 update-source lo
 neighbor 3fff:0:ff::1 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::1 activate
 exit-address-family
exit
!
router bgp 64500 vrf ORO
 bgp router-id 10.255.0.6
 ! Rebanada ORO (baja latencia): su propia VRF, su RT y su SID de servicio
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 64500:610
  rt vpn both 64500:10
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 64500 vrf PLATA
 bgp router-id 10.255.0.6
 ! Rebanada PLATA (tráfico masivo, tolera retardo): su propia VRF, su RT y su SID de servicio
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 64500:611
  rt vpn both 64500:20
  export vpn
  import vpn
 exit-address-family
exit
!
