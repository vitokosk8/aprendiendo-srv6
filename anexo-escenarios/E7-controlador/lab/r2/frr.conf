frr version 10.7.1
frr defaults traditional
hostname r2
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:2::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::2/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:12::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
 ! retardo del enlace, en microsegundos: IS-IS lo anuncia y BGP-LS lo lleva al controlador
 link-params
  delay 2000
 exit-link-params
exit
interface eth2
 ipv6 address 3fff:0:23::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
 ! retardo del enlace, en microsegundos: IS-IS lo anuncia y BGP-LS lo lleva al controlador
 link-params
  delay 1000
 exit-link-params
exit
interface eth3
 ipv6 address 3fff:0:24::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
 ! retardo del enlace, en microsegundos: IS-IS lo anuncia y BGP-LS lo lleva al controlador
 link-params
  delay 5000
 exit-link-params
exit
interface eth4
 ipv6 address 3fff:0:25::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 25
 ! retardo del enlace, en microsegundos: IS-IS lo anuncia y BGP-LS lo lleva al controlador
 link-params
  delay 3000
 exit-link-params
exit
interface eth5
 description enlace con el controlador (ctl)
 ipv6 address 3fff:0:c2::2/64
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 ! r2 entrega su base de datos de IS-IS (la de todo el dominio) a BGP-LS
 distribute link-state
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 ! Productor de BGP-LS: la topología SRv6 de IS-IS, hacia el controlador
 neighbor 3fff:0:c2::100 remote-as 64500
 neighbor 3fff:0:c2::100 description controlador (ctl)
 !
 address-family link-state
  neighbor 3fff:0:c2::100 activate
 exit-address-family
exit
!
