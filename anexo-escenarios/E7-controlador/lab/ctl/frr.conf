frr version 10.7.1
frr defaults traditional
hostname ctl
!
interface eth1
 ipv6 address 3fff:0:c2::100/64
exit
!
router bgp 64500
 bgp router-id 10.255.0.100
 no bgp default ipv4-unicast
 ! Consumidor de BGP-LS: recibe la topología SRv6 de r2. No anuncia nada.
 neighbor 3fff:0:c2::2 remote-as 64500
 neighbor 3fff:0:c2::2 description productor de BGP-LS (r2)
 !
 address-family link-state
  neighbor 3fff:0:c2::2 activate
 exit-address-family
exit
!
