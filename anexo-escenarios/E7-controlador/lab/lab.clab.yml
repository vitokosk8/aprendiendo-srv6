# Escenario E7 · Ingeniería de tráfico con un controlador: BGP-LS y un script en Python
#
# Sobre la topología base y las dos rebanadas de E4 (ORO y PLATA, una VRF y un End.DT4 por PE cada una):
#   * Cada enlace del núcleo anuncia su retardo en IS-IS (link-params delay, en µs).
#   * r2 exporta la base de datos de IS-IS por BGP-LS (distribute link-state) a ctl, el
#     controlador: un FRR que solo ejecuta BGP (consumidor de BGP-LS), en el enganche r2:eth5.
#   * controlador.py lee la topología de ctl, calcula los caminos (ORO: mínimo retardo;
#     PLATA: mínima métrica IGP sin tocar los enlaces de ORO), los convierte en la lista de
#     segmentos más corta posible y los programa en r1 y r6 como estáticas con segmentos.
# FRR no recibe políticas SRv6 por PCEP ni por BGP SR Policy: el script programa los PE con
# vtysh (docker exec). Ver la sección "Lo que FRR aún no hace" del README.
#
#   python3 herramientas/topologia.py anexo-escenarios/E7-controlador/lab/lab.clab.yml

name: esc-e7

topology:
  defaults:
    kind: linux
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.seg6_enabled: 1
      net.ipv6.conf.default.seg6_enabled: 1

  nodes:
    h1:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 1, graph-row: 1, graph-icon: host, graph-desc: "PC1 · sede ORO-1", ip.eth1: "192.168.10.12/24"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 192.168.10.12/24 dev eth1"
        - "ip route add default via 192.168.10.1 dev eth1"

    h11:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 1, graph-row: 2, graph-icon: host, graph-desc: "PC11 · sede PLATA-1", ip.eth1: "192.168.110.11/24"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 192.168.110.11/24 dev eth1"
        - "ip route add default via 192.168.110.1 dev eth1"

    sw1:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 2, graph-row: 2, graph-icon: switch, graph-desc: "switch · sede PLATA-1"}
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 1
        net.ipv6.conf.default.disable_ipv6: 1
      exec:
        - "ip link add br0 type bridge mcast_snooping 0"
        - "sh -c 'for p in eth1 eth2; do ip link set $p master br0; ip link set $p up; done'"
        - "ip link set br0 up"

    r1:
      image: quay.io/frrouting/frr:10.7.1
      # Las VRF de las dos rebanadas y strict_mode se preparan ANTES de arrancar FRR.
      cmd: bash -c "ip link add ORO type vrf table 10 && ip link set ORO up && ip link add PLATA type vrf table 11 && ip link set PLATA up && sysctl -w net.vrf.strict_mode=1; exec /usr/lib/frr/docker-start"
      labels: {graph-level: 3, graph-icon: router, graph-desc: "PE1 · ORO-1 y PLATA-1", ip.lo: "3fff:0:ff::1/128", ip.eth1: "3fff:0:12::1/64 (m=10, 2 ms)", ip.eth2: "3fff:0:13::1/64 (m=15, 2 ms)", ip.eth3: "192.168.10.1/24 (VRF ORO)", ip.eth4: "192.168.110.1/24 (VRF PLATA)", srv6.locator: "5f00:0:1::/48", srv6.sids: "End.DT4 por BGP (VRF ORO) · End.DT4 por BGP (VRF PLATA)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf, r1/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"
        # La interfaz de la sede ORO-1 entra en la VRF ORO
        - "ip link set eth3 master ORO"
        - "ip addr add 192.168.10.1/24 dev eth3"
        # La interfaz de la sede PLATA-1 entra en la VRF PLATA
        - "ip link set eth4 master PLATA"
        - "ip addr add 192.168.110.1/24 dev eth4"
        # Red de seguridad: si falta algún End.DT4 en el kernel, se reaplica la asignación de los SIDs.
        - "bash -c 'for i in $(seq 1 20); do sleep 3; [ $(ip -6 route show | grep -c \"End.DT4 \") -ge 2 ] && exit 0; [ $((i % 4)) -eq 0 ] && for v in ORO PLATA; do vtysh -c \"configure terminal\" -c \"router bgp 64500 vrf $v\" -c \"address-family ipv4 unicast\" -c \"no sid vpn export auto\" -c \"sid vpn export auto\" >/dev/null 2>&1; done; done; exit 0'"

    r2:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 4, graph-row: 1, graph-icon: router, graph-desc: "P · productor de BGP-LS", ip.lo: "3fff:0:ff::2/128", ip.eth1: "3fff:0:12::2/64 (m=10, 2 ms)", ip.eth2: "3fff:0:23::2/64 (m=10, 1 ms)", ip.eth3: "3fff:0:24::2/64 (m=10, 5 ms)", ip.eth4: "3fff:0:25::2/64 (m=25, 3 ms)", ip.eth5: "3fff:0:c2::2/64 (al controlador)", srv6.locator: "5f00:0:2::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf, r2/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r3:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 4, graph-row: 2, graph-icon: router, graph-desc: "P", ip.lo: "3fff:0:ff::3/128", ip.eth1: "3fff:0:13::3/64 (m=15, 2 ms)", ip.eth2: "3fff:0:23::3/64 (m=10, 1 ms)", ip.eth3: "3fff:0:35::3/64 (m=10, 2 ms)", ip.eth4: "3fff:0:34::3/64 (m=25, 4 ms)", srv6.locator: "5f00:0:3::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf, r3/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r4:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 5, graph-row: 1, graph-icon: router, graph-desc: "P", ip.lo: "3fff:0:ff::4/128", ip.eth1: "3fff:0:24::4/64 (m=10, 5 ms)", ip.eth2: "3fff:0:45::4/64 (m=15, 1 ms)", ip.eth3: "3fff:0:46::4/64 (m=10, 2 ms)", ip.eth4: "3fff:0:34::4/64 (m=25, 4 ms)", srv6.locator: "5f00:0:4::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r4/daemons:/etc/frr/daemons, r4/frr.conf:/etc/frr/frr.conf, r4/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r5:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 5, graph-row: 2, graph-icon: router, graph-desc: "P", ip.lo: "3fff:0:ff::5/128", ip.eth1: "3fff:0:35::5/64 (m=10, 2 ms)", ip.eth2: "3fff:0:45::5/64 (m=15, 1 ms)", ip.eth3: "3fff:0:56::5/64 (m=10, 2 ms)", ip.eth4: "3fff:0:25::5/64 (m=25, 3 ms)", srv6.locator: "5f00:0:5::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r5/daemons:/etc/frr/daemons, r5/frr.conf:/etc/frr/frr.conf, r5/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r6:
      image: quay.io/frrouting/frr:10.7.1
      # Las VRF de las dos rebanadas y strict_mode se preparan ANTES de arrancar FRR.
      cmd: bash -c "ip link add ORO type vrf table 10 && ip link set ORO up && ip link add PLATA type vrf table 11 && ip link set PLATA up && sysctl -w net.vrf.strict_mode=1; exec /usr/lib/frr/docker-start"
      labels: {graph-level: 6, graph-icon: router, graph-desc: "PE2 · ORO-2 y PLATA-2", ip.lo: "3fff:0:ff::6/128", ip.eth1: "3fff:0:46::6/64 (m=10, 2 ms)", ip.eth2: "3fff:0:56::6/64 (m=10, 2 ms)", ip.eth3: "192.168.20.1/24 (VRF ORO)", ip.eth4: "192.168.120.1/24 (VRF PLATA)", srv6.locator: "5f00:0:6::/48", srv6.sids: "End.DT4 por BGP (VRF ORO) · End.DT4 por BGP (VRF PLATA)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r6/daemons:/etc/frr/daemons, r6/frr.conf:/etc/frr/frr.conf, r6/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"
        # La interfaz de la sede ORO-2 entra en la VRF ORO
        - "ip link set eth3 master ORO"
        - "ip addr add 192.168.20.1/24 dev eth3"
        # La interfaz de la sede PLATA-2 entra en la VRF PLATA
        - "ip link set eth4 master PLATA"
        - "ip addr add 192.168.120.1/24 dev eth4"
        # Red de seguridad: si falta algún End.DT4 en el kernel, se reaplica la asignación de los SIDs.
        - "bash -c 'for i in $(seq 1 20); do sleep 3; [ $(ip -6 route show | grep -c \"End.DT4 \") -ge 2 ] && exit 0; [ $((i % 4)) -eq 0 ] && for v in ORO PLATA; do vtysh -c \"configure terminal\" -c \"router bgp 64500 vrf $v\" -c \"address-family ipv4 unicast\" -c \"no sid vpn export auto\" -c \"sid vpn export auto\" >/dev/null 2>&1; done; done; exit 0'"

    ctl:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 4, graph-row: 0, graph-icon: host, graph-desc: "controlador · FRR solo con BGP (consumidor de BGP-LS)", ip.eth1: "3fff:0:c2::100/64"}
      binds: [ctl/daemons:/etc/frr/daemons, ctl/frr.conf:/etc/frr/frr.conf, ctl/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"

    sw2:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 7, graph-row: 2, graph-icon: switch, graph-desc: "switch · sede PLATA-2"}
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 1
        net.ipv6.conf.default.disable_ipv6: 1
      exec:
        - "ip link add br0 type bridge mcast_snooping 0"
        - "sh -c 'for p in eth1 eth2; do ip link set $p master br0; ip link set $p up; done'"
        - "ip link set br0 up"

    h2:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 8, graph-row: 1, graph-icon: host, graph-desc: "PC2 · sede ORO-2", ip.eth1: "192.168.20.12/24"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 192.168.20.12/24 dev eth1"
        - "ip route add default via 192.168.20.1 dev eth1"

    h12:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 8, graph-row: 2, graph-icon: host, graph-desc: "PC12 · sede PLATA-2", ip.eth1: "192.168.120.12/24"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 192.168.120.12/24 dev eth1"
        - "ip route add default via 192.168.120.1 dev eth1"

  links:
    # núcleo (igual que la topología base)
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r2:eth3", "r4:eth1"]
    - endpoints: ["r2:eth4", "r5:eth4"]
    - endpoints: ["r3:eth3", "r5:eth1"]
    - endpoints: ["r3:eth4", "r4:eth4"]
    - endpoints: ["r4:eth2", "r5:eth2"]
    - endpoints: ["r4:eth3", "r6:eth1"]
    - endpoints: ["r5:eth3", "r6:eth2"]
    # sedes de la base (en E4, los puertos de la VLAN 100 son las sedes de PLATA)
    - endpoints: ["h1:eth1", "r1:eth3"]
    - endpoints: ["sw1:eth1", "r1:eth4"]
    - endpoints: ["h11:eth1", "sw1:eth2"]
    - endpoints: ["r6:eth3", "h2:eth1"]
    - endpoints: ["r6:eth4", "sw2:eth1"]
    - endpoints: ["sw2:eth2", "h12:eth1"]
    # añadido en E7: el controlador, por un enganche nuevo en r2:eth5
    - endpoints: ["r2:eth5", "ctl:eth1"]
