frr version 10.7.1
frr defaults traditional
hostname r2
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:2::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::2/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:12::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:23::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth3
 ipv6 address 3fff:0:24::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth4
 ipv6 address 3fff:0:25::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 25
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 ! r2 es route reflector: solo plano de control, sin VRF ni SIDs de servicio
 bgp cluster-id 10.255.0.2
 neighbor 3fff:0:ff::1 remote-as 64500
 neighbor 3fff:0:ff::1 update-source lo
 neighbor 3fff:0:ff::1 capability extended-nexthop
 neighbor 3fff:0:ff::5 remote-as 64500
 neighbor 3fff:0:ff::5 update-source lo
 neighbor 3fff:0:ff::5 capability extended-nexthop
 neighbor 3fff:0:ff::6 remote-as 64500
 neighbor 3fff:0:ff::6 update-source lo
 neighbor 3fff:0:ff::6 capability extended-nexthop
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::1 activate
  neighbor 3fff:0:ff::1 route-reflector-client
  neighbor 3fff:0:ff::5 activate
  neighbor 3fff:0:ff::5 route-reflector-client
  neighbor 3fff:0:ff::6 activate
  neighbor 3fff:0:ff::6 route-reflector-client
 exit-address-family
exit
!
