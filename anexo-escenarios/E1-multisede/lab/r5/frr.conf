frr version 10.7.1
frr defaults traditional
hostname r5
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:5::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::5/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:35::5/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:45::5/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 15
exit
interface eth3
 ipv6 address 3fff:0:56::5/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth4
 ipv6 address 3fff:0:25::5/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 25
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0005.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.5
 no bgp default ipv4-unicast
 ! Una sola sesión iBGP: con el route reflector (r2)
 neighbor 3fff:0:ff::2 remote-as 64500
 neighbor 3fff:0:ff::2 description route reflector (r2)
 neighbor 3fff:0:ff::2 update-source lo
 neighbor 3fff:0:ff::2 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::2 activate
 exit-address-family
exit
!
router bgp 64500 vrf BLUE
 bgp router-id 10.255.0.5
 !
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 64500:5
  rt vpn both 64500:10
  export vpn
  import vpn
 exit-address-family
exit
!
