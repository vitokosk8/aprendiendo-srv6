# Escenario E0 · Internet sobre SRv6 — Parte 2: Internet en la tabla global
#
# Mismo caso que la parte 1, pero sin VRF: Internet vive en la tabla global de los PE.
# r1 y r6 intercambian las rutas por iBGP IPv4/IPv6 unicast, y BGP pega a cada ruta un
# SID End.DT46 de la tabla global ('sid export', FRR >= 10.6; 'behavior dt46', >= 10.7).
# Los P (r2–r5) siguen sin BGP: solo reenvían hacia los locators de los PE.
#
# Detalle de Linux: End.DT4/End.DT46 entregan en la tabla de una VRF. Para entregar en la
# tabla principal (254) se crea un dispositivo VRF "vrfdefault" ligado a esa tabla, sin
# interfaces dentro, ANTES de arrancar FRR (en el cmd de r1 y r6).
#
# Equipos añadidos a la base: inet (r6:eth5) y web (inet:eth2). h1 usa aquí direcciones
# públicas del cliente en lugar de las privadas de la base.
#
#   python3 herramientas/topologia.py anexo-escenarios/E0-internet/lab-global/lab.clab.yml
#
# Probado con containerlab 0.82.0, FRR 10.7.1, netshoot v0.13 (OrbStack).

name: esc-e0-global

topology:
  defaults:
    kind: linux
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.seg6_enabled: 1
      net.ipv6.conf.default.seg6_enabled: 1

  nodes:
    h1:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 1, graph-row: 1, graph-icon: host, graph-desc: "cliente de acceso a Internet", ip.eth1: "203.0.113.12/24, 3fff:203:0:113::12/64"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 203.0.113.12/24 dev eth1"
        - "ip -6 addr add 3fff:203:0:113::12/64 dev eth1"
        - "ip route add default via 203.0.113.1 dev eth1"
        - "ip -6 route add default via 3fff:203:0:113::1 dev eth1"

    h11:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 1, graph-row: 2, graph-icon: host, graph-desc: "PC11 · VLAN 100 (no se usa en E0)", ip.eth1: "192.168.100.11/24, 3fff:168:100::11/64"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 192.168.100.11/24 dev eth1"
        - "ip -6 addr add 3fff:168:100::11/64 dev eth1"

    sw1:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 2, graph-row: 2, graph-icon: switch, graph-desc: "switch · VLAN 100 (no se usa en E0)"}
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 1
        net.ipv6.conf.default.disable_ipv6: 1
      exec:
        - "ip link add br0 type bridge mcast_snooping 0"
        - "sh -c 'for p in eth1 eth2; do ip link set $p master br0; ip link set $p up; done'"
        - "ip link set br0 up"

    r1:
      image: quay.io/frrouting/frr:10.7.1
      # VRF "vrfdefault" ligada a la tabla principal (254), sin interfaces: es donde entrega el End.DT46
      # de la tabla global. Se crea, con strict_mode, ANTES de arrancar FRR.
      cmd: bash -c "ip link add vrfdefault type vrf table 254 && ip link set vrfdefault up && sysctl -w net.vrf.strict_mode=1; exec /usr/lib/frr/docker-start"
      labels: {graph-level: 3, graph-icon: router, graph-desc: "PE1 · FRR · BGP", ip.lo: "3fff:0:ff::1/128", ip.eth1: "3fff:0:12::1/64 (m=10)", ip.eth2: "3fff:0:13::1/64 (m=15)", ip.eth3: "203.0.113.1/24, 3fff:203:0:113::1/64", srv6.locator: "5f00:0:1::/48", srv6.sids: "End.DT46 por BGP (tabla global)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r1/daemons:/etc/frr/daemons, r1/frr.conf:/etc/frr/frr.conf, r1/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"
        # Red de seguridad: si el End.DT46 no aparece en el kernel, se reaplica la asignación del SID.
        - "bash -c 'for i in $(seq 1 20); do sleep 3; ip -6 route show | grep -q \"End.DT46 \" && exit 0; [ $((i % 4)) -eq 0 ] && vtysh -c \"configure terminal\" -c \"router bgp 64500\" -c \"address-family ipv4 unicast\" -c \"no sid export auto behavior dt46\" -c \"sid export auto behavior dt46\" -c \"exit-address-family\" -c \"address-family ipv6 unicast\" -c \"no sid export auto behavior dt46\" -c \"sid export auto behavior dt46\" >/dev/null 2>&1; done; exit 0'"

    r2:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 4, graph-row: 1, graph-icon: router, graph-desc: "P · FRR (sin BGP)", ip.lo: "3fff:0:ff::2/128", ip.eth1: "3fff:0:12::2/64 (m=10)", ip.eth2: "3fff:0:23::2/64 (m=10)", ip.eth3: "3fff:0:24::2/64 (m=10)", ip.eth4: "3fff:0:25::2/64 (m=25)", srv6.locator: "5f00:0:2::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r2/daemons:/etc/frr/daemons, r2/frr.conf:/etc/frr/frr.conf, r2/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r3:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 4, graph-row: 2, graph-icon: router, graph-desc: "P · FRR (sin BGP)", ip.lo: "3fff:0:ff::3/128", ip.eth1: "3fff:0:13::3/64 (m=15)", ip.eth2: "3fff:0:23::3/64 (m=10)", ip.eth3: "3fff:0:35::3/64 (m=10)", ip.eth4: "3fff:0:34::3/64 (m=25)", srv6.locator: "5f00:0:3::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r3/daemons:/etc/frr/daemons, r3/frr.conf:/etc/frr/frr.conf, r3/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r4:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 5, graph-row: 1, graph-icon: router, graph-desc: "P · FRR (sin BGP)", ip.lo: "3fff:0:ff::4/128", ip.eth1: "3fff:0:24::4/64 (m=10)", ip.eth2: "3fff:0:45::4/64 (m=15)", ip.eth3: "3fff:0:46::4/64 (m=10)", ip.eth4: "3fff:0:34::4/64 (m=25)", srv6.locator: "5f00:0:4::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r4/daemons:/etc/frr/daemons, r4/frr.conf:/etc/frr/frr.conf, r4/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r5:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 5, graph-row: 2, graph-icon: router, graph-desc: "P · FRR (sin BGP)", ip.lo: "3fff:0:ff::5/128", ip.eth1: "3fff:0:35::5/64 (m=10)", ip.eth2: "3fff:0:45::5/64 (m=15)", ip.eth3: "3fff:0:56::5/64 (m=10)", ip.eth4: "3fff:0:25::5/64 (m=25)", srv6.locator: "5f00:0:5::/48", srv6.sids: "End/End.X automáticos"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r5/daemons:/etc/frr/daemons, r5/frr.conf:/etc/frr/frr.conf, r5/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1 net.ipv6.conf.eth3.seg6_enabled=1 net.ipv6.conf.eth4.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"

    r6:
      image: quay.io/frrouting/frr:10.7.1
      # VRF "vrfdefault" ligada a la tabla principal (254), sin interfaces: es donde entrega el End.DT46
      # de la tabla global. Se crea, con strict_mode, ANTES de arrancar FRR.
      cmd: bash -c "ip link add vrfdefault type vrf table 254 && ip link set vrfdefault up && sysctl -w net.vrf.strict_mode=1; exec /usr/lib/frr/docker-start"
      labels: {graph-level: 6, graph-icon: router, graph-desc: "PE2 · FRR · BGP (borde con Internet)", ip.lo: "3fff:0:ff::6/128", ip.eth1: "3fff:0:46::6/64 (m=10)", ip.eth2: "3fff:0:56::6/64 (m=10)", ip.eth5: "192.0.2.2/30, 3fff:192:0:2::2/64", srv6.locator: "5f00:0:6::/48", srv6.sids: "End.DT46 por BGP (tabla global)"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1, net.ipv6.conf.all.seg6_enabled: 1, net.ipv6.conf.default.seg6_enabled: 1}
      binds: [r6/daemons:/etc/frr/daemons, r6/frr.conf:/etc/frr/frr.conf, r6/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"
        - "sysctl -w net.ipv6.conf.eth1.seg6_enabled=1 net.ipv6.conf.eth2.seg6_enabled=1"
        - "ip link add sr0 type dummy"
        - "ip link set sr0 up"
        - "sysctl -w net.ipv6.conf.sr0.seg6_enabled=1"
        # Red de seguridad: si el End.DT46 no aparece en el kernel, se reaplica la asignación del SID.
        - "bash -c 'for i in $(seq 1 20); do sleep 3; ip -6 route show | grep -q \"End.DT46 \" && exit 0; [ $((i % 4)) -eq 0 ] && vtysh -c \"configure terminal\" -c \"router bgp 64500\" -c \"address-family ipv4 unicast\" -c \"no sid export auto behavior dt46\" -c \"sid export auto behavior dt46\" -c \"exit-address-family\" -c \"address-family ipv6 unicast\" -c \"no sid export auto behavior dt46\" -c \"sid export auto behavior dt46\" >/dev/null 2>&1; done; exit 0'"

    sw2:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 7, graph-row: 2, graph-icon: switch, graph-desc: "switch · VLAN 100 (no se usa en E0)"}
      sysctls:
        net.ipv6.conf.all.disable_ipv6: 1
        net.ipv6.conf.default.disable_ipv6: 1
      exec:
        - "ip link add br0 type bridge mcast_snooping 0"
        - "sh -c 'for p in eth1 eth2; do ip link set $p master br0; ip link set $p up; done'"
        - "ip link set br0 up"

    inet:
      image: quay.io/frrouting/frr:10.7.1
      labels: {graph-level: 7, graph-row: 1, graph-icon: router, graph-desc: "upstream · AS 64496 · FRR", ip.eth1: "192.0.2.1/30, 3fff:192:0:2::1/64", ip.eth2: "198.51.100.1/24, 3fff:198:51:100::1/64"}
      sysctls: {net.ipv6.conf.all.forwarding: 1, net.ipv4.ip_forward: 1}
      binds: [inet/daemons:/etc/frr/daemons, inet/frr.conf:/etc/frr/frr.conf, inet/vtysh.conf:/etc/frr/vtysh.conf]
      exec:
        - "ip -6 route del default dev eth0"

    h2:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 8, graph-row: 3, graph-icon: host, graph-desc: "PC2 · sede BLUE-2 (no se usa en E0)", ip.eth1: "192.168.20.12/24, 3fff:168:20::12/64"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 192.168.20.12/24 dev eth1"
        - "ip -6 addr add 3fff:168:20::12/64 dev eth1"

    h12:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 8, graph-row: 2, graph-icon: host, graph-desc: "PC12 · VLAN 100 (no se usa en E0)", ip.eth1: "192.168.100.12/24, 3fff:168:100::12/64"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 192.168.100.12/24 dev eth1"
        - "ip -6 addr add 3fff:168:100::12/64 dev eth1"

    web:
      image: nicolaka/netshoot:v0.13
      cmd: sleep infinity
      labels: {graph-level: 8, graph-row: 1, graph-icon: host, graph-desc: "servidor web en Internet", ip.eth1: "198.51.100.10/24, 3fff:198:51:100::10/64"}
      exec:
        - "ip route flush default"
        - "ip -6 route del default dev eth0"
        - "ip addr add 198.51.100.10/24 dev eth1"
        - "ip -6 addr add 3fff:198:51:100::10/64 dev eth1"
        - "ip route add default via 198.51.100.1 dev eth1"
        - "ip -6 route add default via 3fff:198:51:100::1 dev eth1"

  links:
    # núcleo (igual que la topología base)
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r2:eth3", "r4:eth1"]
    - endpoints: ["r2:eth4", "r5:eth4"]
    - endpoints: ["r3:eth3", "r5:eth1"]
    - endpoints: ["r3:eth4", "r4:eth4"]
    - endpoints: ["r4:eth2", "r5:eth2"]
    - endpoints: ["r4:eth3", "r6:eth1"]
    - endpoints: ["r5:eth3", "r6:eth2"]
    # sedes de la base
    - endpoints: ["h1:eth1", "r1:eth3"]
    - endpoints: ["sw1:eth1", "r1:eth4"]
    - endpoints: ["h11:eth1", "sw1:eth2"]
    - endpoints: ["r6:eth3", "h2:eth1"]
    - endpoints: ["r6:eth4", "sw2:eth1"]
    - endpoints: ["sw2:eth2", "h12:eth1"]
    # añadidos en E0: Internet por el enganche r6:eth5
    - endpoints: ["r6:eth5", "inet:eth1"]
    - endpoints: ["inet:eth2", "web:eth1"]
