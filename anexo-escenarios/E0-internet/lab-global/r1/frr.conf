frr version 10.7.1
frr defaults traditional
hostname r1
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:1::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::1/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:12::1/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:13::1/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 15
exit
interface eth3
 description hacia h1 (cliente de acceso a Internet)
 ip address 203.0.113.1/24
 ipv6 address 3fff:203:0:113::1/64
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 3fff:0:ff::6 remote-as 64500
 neighbor 3fff:0:ff::6 description iBGP con r6 (PE2)
 neighbor 3fff:0:ff::6 update-source lo
 neighbor 3fff:0:ff::6 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 3fff:0:ff::6 activate
  neighbor 3fff:0:ff::6 encapsulation-srv6
  ! SID End.DT46 para la tabla global (compartido con IPv6)
  sid export auto behavior dt46
 exit-address-family
 address-family ipv6 unicast
  network 3fff:203:0:113::/64
  neighbor 3fff:0:ff::6 activate
  neighbor 3fff:0:ff::6 encapsulation-srv6
  sid export auto behavior dt46
 exit-address-family
exit
!
