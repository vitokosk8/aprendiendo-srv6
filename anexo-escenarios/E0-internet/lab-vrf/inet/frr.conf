frr version 10.7.1
frr defaults traditional
hostname inet
!
interface eth1
 description hacia r6 (operador AS 64500)
 ip address 192.0.2.1/30
 ipv6 address 3fff:192:0:2::1/64
exit
interface eth2
 description red del servidor web
 ip address 198.51.100.1/24
 ipv6 address 3fff:198:51:100::1/64
exit
!
router bgp 64496
 bgp router-id 192.0.2.1
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 192.0.2.2 remote-as 64500
 neighbor 3fff:192:0:2::2 remote-as 64500
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 192.0.2.2 activate
 exit-address-family
 address-family ipv6 unicast
  network 3fff:198:51:100::/64
  neighbor 3fff:192:0:2::2 activate
 exit-address-family
exit
!
