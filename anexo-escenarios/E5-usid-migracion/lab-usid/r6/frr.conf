frr version 10.7.1
frr defaults traditional
hostname r6
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:6::/48 block-len 32 node-len 16 func-bits 16
    ! uSID (NEXT-C-SID, formato F3216): IS-IS instala uN y uA; BGP, uDT46
    behavior usid
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::6/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:46::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:56::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0006.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.6
 no bgp default ipv4-unicast
 neighbor 3fff:0:ff::1 remote-as 64500
 neighbor 3fff:0:ff::1 update-source lo
 neighbor 3fff:0:ff::1 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
  ! Con un solo SID en la lista, sin SRH: solo la cabecera IPv6 exterior
  encap-behavior H_Encaps_Red
 exit
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::1 activate
 exit-address-family
 address-family ipv6 vpn
  neighbor 3fff:0:ff::1 activate
 exit-address-family
exit
!
router bgp 64500 vrf BLUE
 bgp router-id 10.255.0.6
 ! Un solo SID para IPv4 e IPv6 de la VRF: uDT46 (uSID)
 sid vpn per-vrf export auto
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 64500:6
  rt vpn both 64500:10
  export vpn
  import vpn
 exit-address-family
 address-family ipv6 unicast
  redistribute connected
  rd vpn export 64500:6
  rt vpn both 64500:10
  export vpn
  import vpn
 exit-address-family
exit
!
