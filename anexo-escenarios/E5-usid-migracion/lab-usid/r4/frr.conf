frr version 10.7.1
frr defaults traditional
hostname r4
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:4::/48 block-len 32 node-len 16 func-bits 16
    ! uSID (NEXT-C-SID, formato F3216): IS-IS instala uN y uA; BGP, uDT46
    behavior usid
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::4/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:24::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:45::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 15
exit
interface eth3
 ipv6 address 3fff:0:46::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth4
 ipv6 address 3fff:0:34::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 25
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0004.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
