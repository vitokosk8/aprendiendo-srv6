frr version 10.7.1
frr defaults traditional
hostname r1
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:1::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::1/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:12::1/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:13::1/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 15
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.1
 no bgp default ipv4-unicast
 ! iBGP en malla completa entre los tres routers con VRF: r1, r4 y r6
 neighbor 3fff:0:ff::4 remote-as 64500
 neighbor 3fff:0:ff::4 update-source lo
 neighbor 3fff:0:ff::4 capability extended-nexthop
 neighbor 3fff:0:ff::6 remote-as 64500
 neighbor 3fff:0:ff::6 update-source lo
 neighbor 3fff:0:ff::6 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::4 activate
  neighbor 3fff:0:ff::6 activate
 exit-address-family
exit
!
router bgp 64500 vrf BLUE
 bgp router-id 10.255.0.1
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 64500:1
  rt vpn both 64500:10
  export vpn
  import vpn
 exit-address-family
exit
!
