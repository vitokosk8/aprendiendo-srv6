frr version 10.7.1
frr defaults traditional
hostname r4
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:4::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::4/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:24::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:45::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 15
exit
interface eth3
 ipv6 address 3fff:0:46::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth4
 ipv6 address 3fff:0:34::4/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 25
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0004.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64500
 bgp router-id 10.255.0.4
 no bgp default ipv4-unicast
 ! iBGP en malla completa entre los tres routers con VRF: r1, r4 y r6
 neighbor 3fff:0:ff::1 remote-as 64500
 neighbor 3fff:0:ff::1 update-source lo
 neighbor 3fff:0:ff::1 capability extended-nexthop
 neighbor 3fff:0:ff::6 remote-as 64500
 neighbor 3fff:0:ff::6 update-source lo
 neighbor 3fff:0:ff::6 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::1 activate
  neighbor 3fff:0:ff::6 activate
 exit-address-family
exit
!
router bgp 64500 vrf FW1
 bgp router-id 10.255.0.4
 ! VRF del lado BLUE-1 del firewall: SOLO importa las rutas de BLUE (no exporta nada).
 ! Así sabe reencapsular hacia el PE de BLUE-1 el tráfico que sale del firewall por este lado.
 address-family ipv4 unicast
  rd vpn export 64500:41
  rt vpn import 64500:10
  import vpn
 exit-address-family
exit
!
router bgp 64500 vrf FW2
 bgp router-id 10.255.0.4
 ! VRF del lado BLUE-2 del firewall: SOLO importa las rutas de BLUE (no exporta nada).
 ! Así sabe reencapsular hacia el PE de BLUE-2 el tráfico que sale del firewall por este lado.
 address-family ipv4 unicast
  rd vpn export 64500:42
  rt vpn import 64500:10
  import vpn
 exit-address-family
exit
!
! Lo que entra por un SID del proxy se manda al firewall: estas estáticas (distancia 1)
! ganan a la ruta importada por BGP (distancia 200) para la sede del otro lado.
vrf FW1
 ip route 192.168.20.0/24 172.16.41.2
exit-vrf
vrf FW2
 ip route 192.168.10.0/24 172.16.42.2
exit-vrf
!
