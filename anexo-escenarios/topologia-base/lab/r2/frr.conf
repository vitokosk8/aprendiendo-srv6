frr version 10.2.1
frr defaults traditional
hostname r2
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:2::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::2/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 description hacia r1
 ipv6 address 3fff:0:12::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 description hacia r3
 ipv6 address 3fff:0:23::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth3
 description hacia r4
 ipv6 address 3fff:0:24::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth4
 description hacia r5
 ipv6 address 3fff:0:25::2/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 25
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0002.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
