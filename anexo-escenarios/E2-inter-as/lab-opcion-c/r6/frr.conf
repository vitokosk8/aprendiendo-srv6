frr version 10.7.1
frr defaults traditional
hostname r6
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:6::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::6/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:0:46::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 ipv6 address 3fff:0:56::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth6
 description enlace inter-AS con el AS 64501
 ipv6 address 3fff:0:67::6/64
exit
! Agregados del AS: el bloque de SIDs y el de loopbacks (descarte para lo que no exista)
ipv6 route 5f00:0::/32 Null0
ipv6 route 3fff:0:ff::/48 Null0
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0006.00
 segment-routing srv6
  locator MAIN
 exit
 ! Lo aprendido del otro AS por eBGP se mete en el IGP de este AS
 redistribute ipv6 bgp level-2
exit
!
router bgp 64500
 bgp router-id 10.255.0.6
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 3fff:0:67::7 remote-as 64501
 neighbor 3fff:0:67::7 description eBGP inter-AS (solo IPv6 unicast: bloques de SIDs y loopbacks)
 !
 address-family ipv6 unicast
  network 5f00:0::/32
  network 3fff:0:ff::/48
  neighbor 3fff:0:67::7 activate
 exit-address-family
exit
!
