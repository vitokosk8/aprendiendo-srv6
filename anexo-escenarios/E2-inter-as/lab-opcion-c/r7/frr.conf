frr version 10.7.1
frr defaults traditional
hostname r7
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:1:7::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:1:ff::7/128
 ipv6 router isis CORE
 isis passive
exit
interface eth2
 ipv6 address 3fff:1:78::7/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth1
 description enlace inter-AS con el AS 64500
 ipv6 address 3fff:0:67::7/64
exit
! Agregados del AS: el bloque de SIDs y el de loopbacks (descarte para lo que no exista)
ipv6 route 5f00:1::/32 Null0
ipv6 route 3fff:1:ff::/48 Null0
!
router isis CORE
 is-type level-2-only
 net 49.0002.0000.0000.0007.00
 segment-routing srv6
  locator MAIN
 exit
 ! Lo aprendido del otro AS por eBGP se mete en el IGP de este AS
 redistribute ipv6 bgp level-2
exit
!
router bgp 64501
 bgp router-id 10.255.1.7
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 3fff:0:67::6 remote-as 64500
 neighbor 3fff:0:67::6 description eBGP inter-AS (solo IPv6 unicast: bloques de SIDs y loopbacks)
 !
 address-family ipv6 unicast
  network 5f00:1::/32
  network 3fff:1:ff::/48
  neighbor 3fff:0:67::6 activate
 exit-address-family
exit
!
