frr version 10.7.1
frr defaults traditional
hostname r8
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:1:8::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:1:ff::8/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 ipv6 address 3fff:1:78::8/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
!
router isis CORE
 is-type level-2-only
 net 49.0002.0000.0000.0008.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
router bgp 64501
 bgp router-id 10.255.1.8
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 neighbor 3fff:0:ff::1 remote-as 64500
 neighbor 3fff:0:ff::1 description eBGP multisalto con el PE del otro AS (VPNv4)
 neighbor 3fff:0:ff::1 ebgp-multihop 10
 neighbor 3fff:0:ff::1 update-source lo
 neighbor 3fff:0:ff::1 capability extended-nexthop
 !
 segment-routing srv6
  locator MAIN
 exit
 !
 address-family ipv4 vpn
  neighbor 3fff:0:ff::1 activate
 exit-address-family
exit
!
router bgp 64501 vrf BLUE
 bgp router-id 10.255.1.8
 no bgp default ipv4-unicast
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
  sid vpn export auto
  rd vpn export 64501:8
  rt vpn both 64500:10
  export vpn
  import vpn
 exit-address-family
exit
!
