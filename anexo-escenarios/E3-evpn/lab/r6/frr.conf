frr version 10.7.1
frr defaults traditional
hostname r6
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix 5f00:0:6::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
interface lo
 ipv6 address 3fff:0:ff::6/128
 ipv6 router isis CORE
 isis passive
exit
interface eth1
 description hacia r4
 ipv6 address 3fff:0:46::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
interface eth2
 description hacia r5
 ipv6 address 3fff:0:56::6/64
 ipv6 router isis CORE
 isis network point-to-point
 isis metric 10
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0006.00
 segment-routing srv6
  locator MAIN
 exit
exit
!
